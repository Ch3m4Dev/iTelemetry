<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>iTelemetry Overlay - Graph</title>
<style>
  html,body{
    margin:0;
    padding:0;
    background:transparent;
    overflow:hidden;
    width:100%;
    height:100%;
  }

  #panel{
    width:100%;
    height:100%;
    background:rgba(8,8,8,0.6);
    border-radius:8px;
    padding:8px;
    box-sizing:border-box;
    color:#ddd;
    font-family:Segoe UI, system-ui, Arial;
    -webkit-user-select:none;
    -webkit-app-region: drag;
  }

  #telemetryCanvas{
    width:100%;
    height:180px;
    display:block;
    border-radius:6px;
    -webkit-app-region: no-drag;
  }
</style>
</head>
<body>
  <div id="panel">
    <canvas id="telemetryCanvas"></canvas>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
