<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>iTelemetry Manager</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
</head>

<body>

  <div id="app-wrapper">

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">iTelemetry</div>
      <ul class="sidebar-list">
        <li class="sidebar-item selected" data-overlay="inputs">Inputs</li>
        <li class="sidebar-item" data-overlay="delta">Delta</li>
        <!-- futuros overlays -->
      </ul>
    </aside>

    <!-- Content -->
    <main id="content">
      <div id="content-header">
        <h2 id="current-overlay">Configuración</h2>
      </div>

      <div id="content-body">

        <button id="center-overlay" class="btn-primary">Centrar overlay</button>

        <div class="setting-group">
          <label>X</label>
          <input type="number" id="input-x">
        </div>

        <div class="setting-group">
          <label>Y</label>
          <input type="number" id="input-y">
        </div>

        <div class="setting-group">
          <label>Anchura</label>
          <input type="number" id="input-width">
        </div>

        <div class="setting-group">
          <label>Altura</label>
          <input type="number" id="input-height">
        </div>

        <div class="setting-group">
          <label>Opacidad</label>
          <input type="range" id="input-opacity" min="20" max="100">
        </div>

      </div>
    </main>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
